name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/creambuffet-server

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Godot CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: godot-downloader
          load: true
          tags: creambuffet-godot-cli:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate catalogs
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --script tests/integration/validate_catalogs.gd

      - name: Test catalog contract helpers
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --script tests/integration/test_catalog_contract.gd

      - name: Test protocol encode/decode
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path server --script res://tests/test_protocol.gd

      - name: Test extracted match services
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path server --script res://tests/test_match_services.gd

      - name: Test server runtime services
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path server --script res://tests/test_server_services.gd

      - name: Import client resources
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --import

      - name: Validate client sync ID coverage
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --script res://tests/validate_sync_ids.gd

      - name: Validate client level scene data
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --script res://tests/validate_level_scene_data.gd

      - name: Validate player state machine wiring
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --script res://tests/validate_player_state_machine.gd

      - name: Test client network wire contract
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --script res://tests/test_network_wire_contract.gd

      - name: Smoke test offline and online client scenes
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --script res://tests/test_game_scene_smoke.gd

      - name: Parse-check client project
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path client --quit-after 1

      - name: Parse-check server project
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            creambuffet-godot-cli:test \
            godot --headless --path server --quit-after 1

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: creambuffet-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test server boot
        run: |
          docker run --rm \
            -e CREAMBUFFET_SERVER_EXIT_AFTER_MS=3000 \
            -e CREAMBUFFET_SERVER_PORT=7000 \
            -e CREAMBUFFET_SERVER_MAX_CLIENTS=8 \
            creambuffet-server:test

  publish-image:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
